name: Mirror official PlanetScale v2.13.0
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to existing GHCR package
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy official image without rebuilding
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/anam-org/airbyte-source:v2.13.0-upstream \
            planetscale/airbyte-source@sha256:6abecb8af18a00d21c9b2294338f074262d4dff948549b6895a4ab385c51f6d2
      - name: Verify identical manifest digest
        run: |
          docker buildx imagetools inspect ghcr.io/anam-org/airbyte-source:v2.13.0-upstream
          test "$(docker buildx imagetools inspect ghcr.io/anam-org/airbyte-source:v2.13.0-upstream --format '{{.Manifest.Digest}}')" = 'sha256:6abecb8af18a00d21c9b2294338f074262d4dff948549b6895a4ab385c51f6d2'
